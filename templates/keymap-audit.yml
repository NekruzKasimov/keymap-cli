# Daily secret audit with keymap. Copy to .github/workflows/keymap-audit.yml
#
# Everything here is pinned: actions by commit SHA, npm packages by exact version, flyctl by release.
# Bump the versions on purpose, not by accident. This job holds host tokens, so it must never
# install anything unpinned.
#
# Repository secrets, only for the hosts your keymap.yaml references:
#   KEYMAP_GH_TOKEN        fine-grained PAT, this repo only, permission "Secrets: read" (GITHUB_TOKEN cannot list secrets)
#   RAILWAY_TOKEN          Railway -> Account -> Tokens (a read-only project token is enough for audit)
#   VERCEL_TOKEN           Vercel  -> Account -> Tokens; the Vercel CLI reads this variable
#   FLY_API_TOKEN          `flyctl tokens create readonly`
#   CLOUDFLARE_API_TOKEN   Workers Scripts: read
#   SUPABASE_ACCESS_TOKEN  Supabase -> Account -> Access tokens
#   KEYMAP_WEBHOOK         optional Slack or Discord incoming webhook for the daily summary
name: keymap audit
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      KEYMAP_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install keymap and the host CLIs this manifest uses (exact versions, no install scripts)
        run: |
          set -euo pipefail
          npm i -g --ignore-scripts "keymap-cli@${KEYMAP_VERSION}"
          uses() { grep -Eq "^\s*-?\s*(${1}|kind: ${1})\b" keymap.yaml; }
          uses railway    && npm i -g --ignore-scripts @railway/cli@5.71.0 || true
          uses vercel     && npm i -g --ignore-scripts vercel@65.1.0 || true
          uses cloudflare && npm i -g --ignore-scripts wrangler@4.151.3 || true
          uses supabase   && npm i -g --ignore-scripts supabase@2.121.0 || true
      - name: Install flyctl (pinned release)
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
        with:
          version: 0.4.120
      - name: Audit
        env:
          GH_TOKEN: ${{ secrets.KEYMAP_GH_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: keymap audit
      - name: Remind
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KEYMAP_GH_TOKEN }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KEYMAP_WEBHOOK: ${{ secrets.KEYMAP_WEBHOOK }}
        run: if [ -n "${KEYMAP_WEBHOOK:-}" ]; then keymap remind; fi
